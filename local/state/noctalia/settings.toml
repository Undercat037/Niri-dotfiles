[widget.bar]
show_count = false
type = "rylos/tailnet:bar"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
format = "{:%H:%M:%S | %y.%m.%d}"
timezone = "Europe/Kyiv"
vertical_format = "{:%H}\\n{:%M}\\n{:%S}\\n—\\n{:%m}\\n{:%d}"

[widget.mini-docker]
show_count = false
status_mode = "hidden"
type = "8bury/mini-docker:mini-docker"

[widget.network-manager-restart]
glyph = "brand-netbeans"
type = "custom_button"

    [widget.network-manager-restart.actions]
    middle = "exec systemctl restart NetworkManager"

[widget.toggle]
type = "decksters-lab/palette-creator:toggle"

[widget.tray]
drawer = true

[widget.warp]
type = "levi/warp:warp"

[widget.widget]
type = "alexander/screen-toolkit:widget"