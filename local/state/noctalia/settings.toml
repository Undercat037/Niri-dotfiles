config_version = 14

[audio]
enable_overdrive = true
sound_volume = 0.50999998860061169

[backdrop]
blur_intensity = 0.82999998144805431
enabled = true
tint_intensity = 0.61999998614192009

[bar]
order = [ "leftbar", "overlay" ]

    [bar.leftbar]
    end = [
        "widget",
        "keyboard_layout",
        "volume",
        "brightness",
        "bluetooth",
        "network",
        "battery",
        "control-center",
        "session"
    ]
    margin_ends = 0
    position = "left"
    radius = 0
    start = [
        "launcher",
        "workspaces",
        "wallpaper",
        "notifications",
        "clipboard",
        "network-manager-restart",
        "warp",
        "bar",
        "mini-docker",
        "toggle"
    ]
    thickness = 33
    widget_spacing = 11

    [bar.overlay]
    capsule = true
    end = [
        "tray",
        "keyboard_layout",
        "notifications",
        "clipboard",
        "group:g3",
        "network",
        "bluetooth",
        "brightness",
        "battery",
        "control-center"
    ]
    layer = "overlay"
    margin_ends = 10
    padding = 9
    radius = 17
    reserve_space = false
    show_on_workspace_switch = false
    smart_auto_hide = true
    start = [ "group:g2", "group:g1", "privacy", "media" ]

        [[bar.overlay.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 6.0

        [[bar.overlay.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network_tx", "network_rx" ]
        opacity = 1.0
        padding = 6.0

        [[bar.overlay.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "input_volume", "volume" ]
        opacity = 1.0
        padding = 6.0

[control_center]
width = 980

    [control_center.calendar]
    show_week_numbers = true

    [[control_center.shortcuts]]
