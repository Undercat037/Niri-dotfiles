[notification]
background_opacity = 0.99999997764825821
border_color = "primary"
filter_order = [ "filter" ]
history_retention_hours = 8

    [notification.filter.filter]
    allow_permanent = false
    allowed_urgencies = [ "critical" ]
    bypass_dnd = false
    enabled = true
    match = "qbittorrent"
    play_sound = false
    save_history = false
    show_toast = false

[osd]
border_color = "primary"

[plugin_settings."alexander/screen-toolkit"]
result_layer = "overlay"

[plugin_settings."kenn/keybind-cheatsheet"]
cheatsheet_layer = "overlay"

[plugin_settings."noctalia/translator"]
target_lang = "ru"

[plugins]
auto_update = "official"
enabled = [
    "levi/warp",
    "rylos/tailnet",
    "8bury/mini-docker",
    "kenn/keybind-cheatsheet",
    "alexander/screen-toolkit",
    "decksters-lab/palette-creator"
]

[shell]
clipboard_auto_paste = "off"
external_ip_enabled = true
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true

    [shell.launcher]
    app_grid = true
    categories = false
    pinned = [ "obsidian", "steam", "blender", "com.obsproject.Studio", "equibop" ]
    show_app_actions = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 14

    [shell.screenshot]
    annotate = false
    copy_to_clipboard = true
    directory = "/home/deltacat/Pictures/Screenshots"
    filename_pattern = "Screenshot-%Y:%m:%d-%H:%M:%S"
    freeze_screen = true
    save_to_file = true

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl reboot --firmware"
        countdown_seconds = 0.0
        enabled = true
        glyph = "reboot"
        label = "ReBoot to UEFI"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "ADW"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "kitty", "niri", "qt", "umbriel" ]
    community_ids = [ "zen-browser", "ayugram", "telegram", "blender", "zed", "steam", "fastfetch", "obs", "bat", "fzf" ]

[wallpaper]
directory = "/home/deltacat/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/deltacat/Pictures/Wallpapers/wallhaven-3q6kmd_3840x2160.png"

    [wallpaper.last]
    path = "/home/deltacat/Pictures/Wallpapers/wallhaven-3q6kmd_3840x2160.png"

