    [[wallpaper.favorite]]
    path = "/home/deltacat/Pictures/Wallpapers/wallhaven-jekg6w.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/deltacat/Pictures/Wallpapers/Cyberpunk1.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-rainbow"

    [[wallpaper.favorite]]
    community_palette = "Tokyo Night Storm"
