# ────────────── Appearance + animation ──────────────

[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 2

[appearance.blur]
enabled = true

[appearance.shadow]
enabled = true

[animation]
enabled = true
duration_ms = 200
curve = "easeout"

[overview]
scroll_factor_horizontal = 0.6
scroll_factor_vertical = 0.6
